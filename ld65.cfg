MEMORY {
  HEADER: start=$00, size=$10, fill=yes, fillval=$00;
  ZEROPAGE: start=$00, size=$0100;
  STACK: start=$0100, size=$0100;
  OAMBUFFER: start=$0200, size=$0100;
  RAM: start=$0300, size=$0500;
  ROM0: start=$8000, size=$2000, fill=yes, fillval=$FF;
  ROM1: start=$A000, size=$2000, fill=yes, fillval=$FF;
  ROM2: start=$8000, size=$2000, fill=yes, fillval=$FF;
  ROM3: start=$A000, size=$2000, fill=yes, fillval=$FF;
  ROM4: start=$8000, size=$2000, fill=yes, fillval=$FF;
  ROM5: start=$A000, size=$2000, fill=yes, fillval=$FF;
  ROM6: start=$C000, size=$2000, fill=yes, fillval=$FF;
  ROM7: start=$E000, size=$2000, fill=yes, fillval=$FF;
  CHRROM: start=$0000, size=$8000;
}

SEGMENTS {
  HEADER: load=HEADER, type=ro, align=$10;
  ZEROPAGE: load=ZEROPAGE, type=zp;
  STACK: load=STACK, type=bss, optional=yes;
  OAM: load=OAMBUFFER, type=bss, optional=yes;
  BSS: load=RAM, type=bss, optional=yes;
  CODE0: load=ROM0, type=ro, align=$0100;
  CODE1: load=ROM1, type=ro, align=$0100;
  CODE2: load=ROM2, type=ro, align=$0100;
  CODE3: load=ROM3, type=ro, align=$0100;
  CODE4: load=ROM4, type=ro, align=$0100;
  CODE5: load=ROM5, type=ro, align=$0100;
  FIXED_CODE0: load=ROM6, type=ro, align=$0100;
  DMC: load=ROM7, type=ro, align=64, optional=yes;
  CODE: load=ROM7, type=ro, align=$0100;
  RODATA: load=ROM7, type=ro, align=$0100;
  VECTORS: load=ROM7, type=ro, start=$FFFA;
  CHRROM: load=CHRROM, type=ro, align=16, optional=yes;
}